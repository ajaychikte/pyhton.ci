name: Python-CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python.ci/requirements.txt

      - name: Run Tests
        run: |
          python -m unittest discover -s python.ci -p "test_*.py"

      - name: Build Package
        run: |
          python -m pip install build
          python -m build python.ci

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: "Python-CI"
          SLACK_MESSAGE: >-
            Workflow '${{ github.workflow }}' finished with status
            '${{ job.status }}' on branch '${{ github.ref_name }}'.
            Commit: '${{ github.sha }}'. Triggered by '${{ github.actor }}'.